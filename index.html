<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크몽 HR 질문 봇</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #00C471; --dark: #111827; --gray: #6B7280;
    --light: #F9FAFB; --border: #E5E7EB;
    --red-light: #FFF5F5; --red-border: #FEE2E2; --yellow-light: #FFFBEB;
  }
  html, body { height: 100%; font-family: 'Pretendard', -apple-system, sans-serif; background: #F0FDF4; color: var(--dark); }

  /* 오버레이 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .overlay.hidden { display: none !important; }
  .setup-box { background: white; border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
  .setup-logo { width: 48px; height: 48px; border-radius: 12px; background: var(--green); display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; font-size: 18px; margin-bottom: 20px; }
  .setup-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .setup-desc { font-size: 14px; color: var(--gray); line-height: 1.6; margin-bottom: 24px; }
  .setup-label { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: block; }
  .setup-input { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 8px; transition: border-color 0.15s; }
  .setup-input:focus { border-color: var(--green); }
  .setup-hint { font-size: 12px; color: var(--gray); margin-bottom: 20px; line-height: 1.6; }
  .setup-hint a { color: var(--green); text-decoration: none; }
  .setup-btn { width: 100%; padding: 13px; border-radius: 10px; background: var(--green); border: none; color: white; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .setup-error { font-size: 12px; color: #DC2626; margin-top: 10px; display: none; }

  /* 레이아웃 */
  .layout { display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; padding: 20px 16px; gap: 12px; }

  /* 헤더 */
  .header { background: white; border-radius: 16px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.06); flex-shrink: 0; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 11px; background: var(--green); display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; font-size: 16px; }
  .header-text h1 { font-size: 16px; font-weight: 700; }
  .header-text p { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .tab-btn { padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1.5px solid var(--border); background: white; color: var(--gray); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .tab-btn.active { background: var(--green); border-color: var(--green); color: white; }
  .key-btn { padding: 7px 14px; border-radius: 20px; font-size: 12px; border: 1.5px solid var(--border); background: white; color: var(--gray); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .key-btn:hover { border-color: var(--green); color: var(--green); }
  .badge { background: #FEE2E2; color: #DC2626; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; display: none; }
  .badge.visible { display: inline-block; }

  /* 채팅 */
  .chat-panel { background: white; border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
  .messages { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
  .msg { display: flex; gap: 10px; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .bubble { background: var(--green); color: white; border-top-right-radius: 4px; }
  .msg.bot .bubble { background: var(--light); border-top-left-radius: 4px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; margin-top: 2px; }
  .msg.bot .avatar { background: #DCFCE7; }
  .msg.user .avatar { background: var(--green); color: white; font-size: 11px; font-weight: 700; }
  .msg-body { max-width: 78%; }
  .bubble { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.65; }
  .time { font-size: 11px; color: #9CA3AF; margin-top: 5px; }
  .msg.user .time { text-align: right; }
  .no-ans-tag { display: inline-block; margin-top: 8px; background: var(--yellow-light); color: #92400E; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 6px; border: 1px solid #FDE68A; }
  .typing { display: flex; gap: 5px; align-items: center; padding: 2px 0; }
  .typing span { width: 7px; height: 7px; background: #9CA3AF; border-radius: 50%; animation: bounce 1.1s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-7px); } }
  .quick-wrap { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 7px; flex-wrap: wrap; flex-shrink: 0; }
  .quick { padding: 6px 13px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1.5px solid var(--green); color: var(--green); background: white; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.15s; }
  .quick:hover { background: var(--green); color: white; }
  .input-wrap { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  textarea { flex: 1; border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-family: inherit; resize: none; min-height: 42px; max-height: 120px; outline: none; transition: border-color 0.15s; }
  textarea:focus { border-color: var(--green); }
  textarea::placeholder { color: #9CA3AF; }
  .send { width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; background: var(--green); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .send:disabled { opacity: 0.35; cursor: not-allowed; }
  .send svg { width: 18px; height: 18px; fill: white; }

  /* 관리자 */
  .admin-panel { background: white; border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 24px; flex: 1; overflow-y: auto; display: none; min-height: 0; }
  .admin-panel.visible { display: block; }
  .admin-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .admin-desc { font-size: 13px; color: var(--gray); margin-bottom: 20px; }
  .empty-state { text-align: center; padding: 48px 0; color: var(--gray); font-size: 14px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
  .q-list { display: flex; flex-direction: column; gap: 10px; }
  .q-item { border: 1.5px solid var(--red-border); border-radius: 12px; padding: 14px 16px; background: var(--red-light); }
  .q-text { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
  .q-time { font-size: 11px; color: var(--gray); }
  .clear-btn { margin-top: 20px; padding: 8px 18px; border-radius: 8px; border: 1.5px solid var(--border); background: white; font-size: 13px; color: var(--gray); cursor: pointer; font-family: inherit; }
  .clear-btn:hover { border-color: #EF4444; color: #EF4444; }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="setup-box">
    <div class="setup-logo">K</div>
    <div class="setup-title">HR 질문 봇 설정</div>
    <div class="setup-desc">사용을 시작하려면 Anthropic API 키가 필요해요.<br>키는 이 브라우저에만 저장돼요.</div>
    <label class="setup-label">Anthropic API 키</label>
    <input class="setup-input" id="apiKeyInput" type="password" placeholder="sk-ant-..." />
    <div class="setup-hint">
      키가 없으면 <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> 접속<br>
      → 로그인 → API Keys → Create Key
    </div>
    <button class="setup-btn" onclick="saveKey()">시작하기</button>
    <div class="setup-error" id="setupError">sk-로 시작하는 API 키를 입력해주세요.</div>
  </div>
</div>

<div class="layout">
  <div class="header">
    <div class="header-left">
      <div class="logo">K</div>
      <div class="header-text">
        <h1>HR 질문 봇</h1>
        <p>취업규칙 · HR 가이드 기반으로 답변해요</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="key-btn" onclick="showSetup()">🔑 API 키</button>
      <button class="tab-btn active" onclick="switchTab('chat')">💬 질문하기</button>
      <button class="tab-btn" onclick="switchTab('admin')">🔒 관리자 <span class="badge" id="badge"></span></button>
    </div>
  </div>

  <div class="chat-panel" id="chatPanel">
    <div class="messages" id="messages"></div>
    <div class="quick-wrap">
      <button class="quick" onclick="qa('의무 근로시간이 어떻게 돼?')">의무 근로시간은?</button>
      <button class="quick" onclick="qa('재택근무 출근 시간이 언제야?')">재택 출근시간은?</button>
      <button class="quick" onclick="qa('오전 반차 쓰면 몇 시에 출근해야 해?')">반차 출퇴근 시간은?</button>
      <button class="quick" onclick="qa('공휴일에 근무하려면 어떻게 해?')">공휴일 근무 방법은?</button>
      <button class="quick" onclick="qa('지각하면 어떻게 처리돼?')">지각 처리는?</button>
    </div>
    <div class="input-wrap">
      <textarea id="inp" placeholder="HR 관련 궁금한 것을 물어보세요..." rows="1"
        onkeydown="hk(event)" oninput="rs(this)"></textarea>
      <button class="send" id="sendBtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2 21L23 12L2 3V10L17 12L2 14V21Z"/></svg>
      </button>
    </div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-title">미답변 질문 관리</div>
    <div class="admin-desc">HR 문서에서 답을 찾지 못한 질문이에요. 자주 묻는 내용은 HR 가이드에 추가해보세요.</div>
    <div id="adminContent"></div>
  </div>
</div>

<script>
const DOC = `
[크몽 근무시간 규정]

=== 의무근로 시간 ===
- 매일 오전 11시~오후 4시 (점심시간 제외 4시간)
- 미준수 시 지각/조퇴 처리

=== 재택 근무 ===
- 출근: 오전 10시까지 / 퇴근: 오후 6시 (선택적근로제 시 오후 5시 이후)

=== 오피스 근무 ===
- 출근: 오전 11시까지
- 퇴근: 출근시간으로부터 7시간 이후 (선택적근로제 시 최소 6시간)
- 최소 주 3회 오피스 출근 (전사 공통: 매주 월요일 / 팀별 공통: 1회 이상)
- 오피스 출근 시 세콤 태깅 필수

=== 외근 ===
- 출근: 오전 11시까지 (오피스 경유 시 오피스 도착시간, 직행 시 외근지 도착시간)
- 퇴근: 출근시간으로부터 7시간 이후

=== 반차 ===
- 오후 반차: 오전 10시 출근 ~ 오후 1시 30분 이후 퇴근
- 오전 반차: 오후 2시 출근 ~ 오후 5시 30분 이후 퇴근
- 재택/오피스/외근 모두 동일

=== 출장 ===
- 간주근로제: 오전 10시 출근~오후 6시 퇴근으로 간주

=== 하이브리드 근무 ===
- 기본 불가. 필요 시 People팀과 상의

=== 월별 최소·목표 근로시간 ===
- 최소근로시간 = 당월 워킹데이 × 7h
- 1월:147/155 | 2월:119/140 | 3월:147/155 | 4월:154/150
- 5월:126/155 | 6월:147/150 | 7월:161/155 | 8월:140/155
- 9월:140/150 | 10월:140/155 | 11월:147/150 | 12월:154/155

=== 점심시간 ===
- 오후 1시~2시 고정. 개인 사유 시프트 불가
- 업무상 조정 필요 시 팀 슬랙에서 Lead 승인 필요

=== 휴게시간 ===
- 4시간 근무 시 30분, 8시간 근무 시 1시간 이상 (법정)

=== 공휴일 근무 ===
- 소속 Lead 및 LT 사전승인 필수
- 신청: Flex > 워크플로우 > 공휴일근무 신청서
- 수당은 익월 급여 반영

=== 야간 근무 ===
- 오후 10시~익일 오전 6시
- 소속 Lead 및 LT 사전승인 필수
- 신청: Flex > 워크플로우 > 야간근무 신청서

=== 지각 & 조퇴 ===
- 예상 시 미리 반차 사용
- 발생 시: 1) 무급처리+횟수누계(반복 시 징계) 또는 2) 반차 처리
- 해당 경우: 의무근로시간 미준수 / 일일 최소 6시간 미충족

=== 근무 기록 ===
- 5일 경과 시: Flex > 과거 근무수정 요청서 (LT 승인)
- 근태마감 후 수정 불가 / 기록 없는 날 자동 휴가처리
- 월간 최소근로시간 미달 시 무급처리

=== 규정 외 재택 ===
- LT 승인 필수
- 허용: 질병(소견서/진단서), 자녀 질병 등 가족 돌봄
- 담당: People팀 Berry
`;

let busy = false;
let una = JSON.parse(localStorage.getItem('hr_una') || '[]');

function getKey() { return localStorage.getItem('hr_key') || ''; }

function saveKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  if (!k.startsWith('sk-')) {
    document.getElementById('setupError').style.display = 'block';
    return;
  }
  localStorage.setItem('hr_key', k);
  document.getElementById('overlay').classList.add('hidden');
  if (!document.getElementById('messages').children.length) boot();
}

function showSetup() {
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('apiKeyInput').value = getKey();
  document.getElementById('setupError').style.display = 'none';
}

function boot() {
  addBot('안녕하세요! 크몽 HR 질문 봇이에요 👋\n\nHR 관련 궁금한 것을 편하게 물어보세요. 취업규칙과 HR 가이드 문서를 기반으로 답변해드려요!');
  updateBadge();
}

window.onload = () => {
  document.getElementById('apiKeyInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveKey(); });
  if (getKey()) { document.getElementById('overlay').classList.add('hidden'); boot(); }
};

async function callAPI(q) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': getKey(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 800,
      messages: [{ role: 'user', content:
`당신은 크몽 HR 담당 도우미입니다. 아래 HR 문서만 기반으로 답변하세요.
답이 있으면: 친근하고 간결하게 한국어로 답변 + 관련 섹션명 안내.
답이 없으면: 반드시 "UNANSWERED:" 로 시작 후 "해당 내용은 HR 문서에서 찾을 수 없어요. People팀(@berry)에 직접 문의해주세요!" 만 답하세요.

--- HR 문서 ---
${DOC}
--- 끝 ---

질문: ${q}` }]
    })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.content[0].text;
}

async function send() {
  const el = document.getElementById('inp');
  const q = el.value.trim();
  if (!q || busy) return;
  el.value = ''; rs(el);
  busy = true; document.getElementById('sendBtn').disabled = true;
  addUser(q);
  const tid = addTyping();
  try {
    const ans = await callAPI(q);
    delTyping(tid);
    const isU = ans.startsWith('UNANSWERED:');
    addBot(isU ? ans.replace('UNANSWERED:', '').trim() : ans, isU);
    if (isU) { una.push({ q, time: new Date().toLocaleString('ko-KR') }); localStorage.setItem('hr_una', JSON.stringify(una)); updateBadge(); }
  } catch(e) {
    delTyping(tid);
    addBot('오류가 발생했어요. 🔑 API 키 버튼에서 키를 확인해주세요.\n\n오류: ' + e.message);
  }
  busy = false; document.getElementById('sendBtn').disabled = false;
}

function qa(q) { document.getElementById('inp').value = q; send(); }
function hk(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function rs(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function t() { return new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }); }
function x(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function sc() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }

function addUser(txt) {
  document.getElementById('messages').innerHTML += `<div class="msg user"><div class="avatar">나</div><div class="msg-body"><div class="bubble">${x(txt)}</div><div class="time">${t()}</div></div></div>`;
  sc();
}
function addBot(txt, isU=false) {
  const tag = isU ? `<div class="no-ans-tag">📋 HR팀에 전달됨</div>` : '';
  document.getElementById('messages').innerHTML += `<div class="msg bot"><div class="avatar">🤖</div><div class="msg-body"><div class="bubble">${x(txt).replace(/\n/g,'<br>')}${tag}</div><div class="time">${t()}</div></div></div>`;
  sc();
}
let tc=0;
function addTyping() {
  const id='tp'+(++tc);
  document.getElementById('messages').innerHTML += `<div class="msg bot" id="${id}"><div class="avatar">🤖</div><div class="msg-body"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div></div>`;
  sc(); return id;
}
function delTyping(id) { const e=document.getElementById(id); if(e) e.remove(); }

function switchTab(tab) {
  const isC = tab==='chat';
  document.getElementById('chatPanel').style.display = isC ? 'flex' : 'none';
  document.getElementById('adminPanel').classList.toggle('visible', !isC);
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0)===isC));
  if (!isC) renderAdmin();
}

function updateBadge() {
  const b = document.getElementById('badge');
  b.textContent = una.length; b.classList.toggle('visible', una.length > 0);
}
function renderAdmin() {
  const el = document.getElementById('adminContent');
  if (!una.length) { el.innerHTML=`<div class="empty-state"><div class="icon">✅</div>미답변 질문이 없어요</div>`; return; }
  el.innerHTML = `<div class="q-list">${una.map(i=>`<div class="q-item"><div class="q-text">Q. ${x(i.q)}</div><div class="q-time">${i.time}</div></div>`).join('')}</div><button class="clear-btn" onclick="clearQ()">목록 초기화</button>`;
}
function clearQ() {
  if (!confirm('목록을 모두 삭제할까요?')) return;
  una=[]; localStorage.removeItem('hr_una'); updateBadge(); renderAdmin();
}
</script>
</body>
</html>
